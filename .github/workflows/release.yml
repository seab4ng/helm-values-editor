name: CI / Release

on:
  push:
    branches: [main, 'feature/**']
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  checks: write
  contents: write       # needed for CHANGELOG commit on tag push
  security-events: write
  pull-requests: write

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Run tests
        run: |
          node --test --experimental-test-coverage \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=test-results.xml \
            tests/unit.js

      - name: Publish test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Tests
          path: test-results.xml
          reporter: java-junit
          fail-on-error: true

  docker:
    name: Build, Scan & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stamp CHANGELOG — replace [Unreleased] with version and date
        run: |
          VERSION="${GITHUB_REF_NAME}"          # e.g. v1.1.0
          VERSION_NUM="${VERSION#v}"            # strip leading v → 1.1.0
          DATE="$(date -u +%Y-%m-%d)"
          # Replace first occurrence of [Unreleased] (with or without — targeting X.Y.Z suffix)
          sed -i "s/## \[Unreleased\][^\n]*/## [${VERSION_NUM}] - ${DATE}/" CHANGELOG.md
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m "docs(changelog): stamp ${VERSION_NUM} release date"
          git push origin HEAD:main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image (local, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          build-args: BUILD_VERSION=${{ github.ref_name }}
          tags: |
            sokushinbutsu/helm-values-editor:${{ github.ref_name }}
            sokushinbutsu/helm-values-editor:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: sokushinbutsu/helm-values-editor:${{ github.ref_name }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy.sarif

      - name: Push to Docker Hub
        if: success()
        run: |
          docker push sokushinbutsu/helm-values-editor:${{ github.ref_name }}
          docker push sokushinbutsu/helm-values-editor:latest
