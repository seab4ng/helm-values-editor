name: E2E Tests

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

permissions:
  checks: write
  contents: write
  pull-requests: write

jobs:
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test

      - name: Publish E2E test report (dorny - Check Run)
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: E2E Test Report
          path: e2e-results.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Deploy Playwright report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always() && github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright-report
          keep_files: false

  # Branch protection requires a status check named exactly "E2E Tests".
  # The previous source for that name (the dorny test-reporter check run) cannot
  # be created on Dependabot PRs, where GITHUB_TOKEN is read-only — so the check
  # stayed "Expected" forever and blocked every Dependabot PR from merging.
  # A job-level check run is always reported by Actions itself (no token needed),
  # so this lightweight gate publishes the required "E2E Tests" status on every
  # PR, mirroring the result of the Playwright job above.
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: e2e
    if: always()
    steps:
      - name: Reflect E2E result
        run: |
          echo "Playwright job result: ${{ needs.e2e.result }}"
          test "${{ needs.e2e.result }}" = "success"
