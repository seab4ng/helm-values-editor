name: Weekly Docker Rebuild

on:
  schedule:
    - cron: '0 6 * * 1'   # every Monday 06:00 UTC
  workflow_dispatch:        # allow manual trigger

permissions:
  contents: read
  security-events: write

jobs:
  rebuild:
    name: Rebuild & Push Latest Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get current version from manifest
        id: version
        run: echo "version=$(node -p "require('./.release-please-manifest.json')['.']")" >> "$GITHUB_OUTPUT"

      - name: Build image (local, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          build-args: BUILD_VERSION=v${{ steps.version.outputs.version }}
          tags: |
            sokushinbutsu/helm-values-editor:v${{ steps.version.outputs.version }}
            sokushinbutsu/helm-values-editor:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: sokushinbutsu/helm-values-editor:v${{ steps.version.outputs.version }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy.sarif') != ''
        with:
          sarif_file: trivy.sarif

      - name: Push to Docker Hub
        if: success()
        run: |
          docker push sokushinbutsu/helm-values-editor:v${{ steps.version.outputs.version }}
          docker push sokushinbutsu/helm-values-editor:latest
